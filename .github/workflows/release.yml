name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  BASELINE_SHA: de2e37f55038a8c01a47f552c217b70377035f89

jobs:
  actionlint:
    name: Lint Workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run pinned actionlint v1.7.12
        run: bash scripts/release-actionlint.sh

  prerequisite:
    name: Verify Tag and Quality Gates
    needs: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Assert tag matches workspace version
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          PKG_VER=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="darius-cli") | .version')
          EXPECTED_TAG="v${PKG_VER}"
          if [ "$TAG" != "$EXPECTED_TAG" ]; then
            echo "Tag mismatch: ref is $TAG but workspace package version is $EXPECTED_TAG" >&2
            exit 1
          fi
          echo "Tag $TAG matches package version $PKG_VER"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Run PTY suite serially
        run: cargo test -p darius-cli --test tui_pty -- --nocapture --test-threads=1

      - name: Run installer tests
        run: bash tests/install_test.sh

      - name: Run public claims audit
        run: bash scripts/audit-public-claims.sh

  build:
    name: Build ${{ matrix.target }}
    needs: prerequisite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: darius-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: darius-macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: darius-macos-x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release -p darius-cli --target ${{ matrix.target }}

      - name: Package and checksum
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.asset_name }}.tar.gz darius
          cd ../../..
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ${{ matrix.asset_name }}.tar.gz > ${{ matrix.asset_name }}.sha256
          else
            shasum -a 256 ${{ matrix.asset_name }}.tar.gz > ${{ matrix.asset_name }}.sha256
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}.tar.gz
            ${{ matrix.asset_name }}.sha256

  evidence:
    name: Verify Release Evidence
    needs: [prerequisite, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Verify artifacts and generate release evidence
        shell: bash
        run: |
          mkdir -p dist
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.sha256" \) -exec cp {} dist/ \;
          cp install.sh dist/

          python3 scripts/release-evidence.py \
            --repo . \
            --dist dist \
            --tag "${{ github.ref_name }}" \
            --baseline "${{ env.BASELINE_SHA }}" \
            --out dist/release-evidence.json

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: dist/*

  host:
    name: Exact-Host Release Binary
    needs: evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release bundle
        uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: release-dist

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Stage host-compatible binary and run gate
        shell: bash
        run: |
          mkdir -p /tmp/darius-release
          tar -xzf release-dist/darius-linux-x86_64.tar.gz -C /tmp/darius-release
          chmod +x /tmp/darius-release/darius
          echo "=== Host binary version ==="
          /tmp/darius-release/darius --version
          DARIUS_BIN_UNDER_TEST=/tmp/darius-release/darius bash scripts/release-host.sh
          rm -rf /tmp/darius-release

  release:
    name: Publish Release
    needs: [evidence, host]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download release bundle
        uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: release-dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release-dist/*.tar.gz
            release-dist/*.sha256
            release-dist/install.sh
            release-dist/release-evidence.json
          generate_release_notes: true
          fail_on_unmatched_files: true
