name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: darius-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: darius-macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: darius-macos-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release -p darius-cli --target ${{ matrix.target }}

      - name: Package and checksum (Unix)
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ asset_name }}.tar.gz darius
          cd ../../..
          sha256sum ${{ asset_name }}.tar.gz > ${{ asset_name }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ asset_name }}
          path: |
            ${{ asset_name }}.tar.gz
            ${{ asset_name }}.sha256

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Safe: github.ref_name is the tag that triggered this release (validated by on.push.tags filter)
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/*/*.tar.gz
            artifacts/*/*.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
