name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  prerequisite:
    name: Verify Tag and Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Assert tag matches workspace version
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          PKG_VER=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="darius-cli") | .version')
          EXPECTED_TAG="v${PKG_VER}"
          if [ "$TAG" != "$EXPECTED_TAG" ]; then
            echo "Tag mismatch: ref is $TAG but workspace package version is $EXPECTED_TAG" >&2
            exit 1
          fi
          echo "Tag $TAG matches package version $PKG_VER"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Run PTY suite serially
        run: cargo test -p darius-cli --test tui_pty -- --nocapture --test-threads=1

      - name: Run installer tests
        run: bash tests/install_test.sh

      - name: Run public claims audit
        run: bash scripts/audit-public-claims.sh

  build:
    name: Build ${{ matrix.target }}
    needs: prerequisite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: darius-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: darius-macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: darius-macos-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release -p darius-cli --target ${{ matrix.target }}

      - name: Package and checksum
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.asset_name }}.tar.gz darius
          cd ../../..
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ${{ matrix.asset_name }}.tar.gz > ${{ matrix.asset_name }}.sha256
          else
            shasum -a 256 ${{ matrix.asset_name }}.tar.gz > ${{ matrix.asset_name }}.sha256
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}.tar.gz
            ${{ matrix.asset_name }}.sha256

  evidence:
    name: Verify Release Evidence
    needs: [prerequisite, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Verify artifacts and generate release evidence
        shell: bash
        run: |
          mkdir -p dist
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.sha256" \) -exec cp {} dist/ \;
          cp install.sh dist/

          # Verify all target archives and checksums exist
          test -f dist/darius-linux-x86_64.tar.gz
          test -f dist/darius-linux-x86_64.sha256
          test -f dist/darius-macos-aarch64.tar.gz
          test -f dist/darius-macos-aarch64.sha256
          test -f dist/darius-macos-x86_64.tar.gz
          test -f dist/darius-macos-x86_64.sha256
          test -f dist/install.sh

          # Verify all checksums match
          for asset in darius-linux-x86_64 darius-macos-aarch64 darius-macos-x86_64; do
            EXPECTED=$(awk '{print $1}' dist/${asset}.sha256)
            ACTUAL=$(sha256sum dist/${asset}.tar.gz | awk '{print $1}')
            if [ "$EXPECTED" != "$ACTUAL" ]; then
              echo "Checksum verification failed for ${asset}" >&2
              exit 1
            fi
            echo "Verified checksum for ${asset}: ${ACTUAL}"
          done

          # Verify host-compatible installed binary --version and help
          TEST_DIR=$(mktemp -d)
          bash dist/install.sh --artifact-dir dist --version "${{ github.ref_name }}" --install-dir "$TEST_DIR/bin"
          "$TEST_DIR/bin/darius" --version
          "$TEST_DIR/bin/darius" --help
          rm -rf "$TEST_DIR"

          # Write release-evidence.json
          TAG="${{ github.ref_name }}"
          PKG_VER=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="darius-cli") | .version')
          COMMIT_SHA=$(git rev-parse HEAD)
          LINUX_SHA=$(awk '{print $1}' dist/darius-linux-x86_64.sha256)
          MACOS_ARM_SHA=$(awk '{print $1}' dist/darius-macos-aarch64.sha256)
          MACOS_X86_SHA=$(awk '{print $1}' dist/darius-macos-x86_64.sha256)
          INSTALLER_SHA=$(sha256sum dist/install.sh | awk '{print $1}')

          cat << EOF > dist/release-evidence.json
          {
            "tag": "$TAG",
            "version": "$PKG_VER",
            "commit_sha": "$COMMIT_SHA",
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "artifacts": {
              "darius-linux-x86_64.tar.gz": "$LINUX_SHA",
              "darius-macos-aarch64.tar.gz": "$MACOS_ARM_SHA",
              "darius-macos-x86_64.tar.gz": "$MACOS_X86_SHA",
              "install.sh": "$INSTALLER_SHA"
            }
          }
          EOF

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: dist/*

  release:
    name: Publish Release
    needs: evidence
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download release bundle
        uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: release-dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release-dist/*.tar.gz
            release-dist/*.sha256
            release-dist/install.sh
            release-dist/release-evidence.json
          generate_release_notes: true
          fail_on_unmatched_files: true
