[package]
name = "darius-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Darius daemon — session manager, A2A hub, and service orchestrator"

[lib]
name = "darius_daemon"
path = "src/lib.rs"

[dependencies]
tokio = { workspace = true, features = ["sync", "rt"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true }
uuid = { workspace = true }
darius-core = { path = "../darius-core" }
darius-rlm = { path = "../darius-rlm" }
darius-hashline = { path = "../darius-hashline" }
darius-lsp = { path = "../darius-lsp" }
darius-skills = { path = "../darius-skills" }
darius-safety = { path = "../darius-safety" }
darius-memory = { path = "../darius-memory" }
darius-tools = { path = "../darius-tools" }
darius-cognitive = { path = "../darius-cognitive" }
parking_lot = "0.12"
libc = "0.2"
dirs = "5"
blake3 = { workspace = true }

[features]
default = []
live-providers = ["reqwest"]
messaging-telegram = []
messaging-discord = []

[dependencies.reqwest]
version = "0.12"
features = ["json"]
optional = true
