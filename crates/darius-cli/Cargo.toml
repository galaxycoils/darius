[package]
name = "darius-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Darius CLI: start, stop, attach, eval, learn"

[lib]
name = "darius_cli"
path = "src/lib.rs"

[[bin]]
name = "darius"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
darius-core = { path = "../darius-core" }
darius-daemon = { path = "../darius-daemon" }
uuid = { workspace = true }
darius-memory = { path = "../darius-memory" }
darius-tools = { path = "../darius-tools" }
darius-cognitive = { path = "../darius-cognitive" }

