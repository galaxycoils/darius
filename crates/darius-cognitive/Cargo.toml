[package]
name = "darius-cognitive"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CognitiveLoop — plan, execute, react, accept"

[lib]
name = "darius_cognitive"
path = "src/lib.rs"

[features]
default = []

[dependencies]
serde = { workspace = true, features = ["derive"] }
