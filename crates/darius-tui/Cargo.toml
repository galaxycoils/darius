[package]
name = "darius-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Darius TUI — ratatui session UI"

[lib]
name = "darius_tui"
path = "src/lib.rs"

[dependencies]
ratatui = "0.27"
crossterm = "0.27"
unicode-width = "0.1"
darius-cognitive = { path = "../darius-cognitive" }
serde = { workspace = true, features = ["derive"] }
uuid = { workspace = true }
tokio = { workspace = true }
tokio-util = "0.7"

[dev-dependencies]
insta = "1"
pretty_assertions = "1"
