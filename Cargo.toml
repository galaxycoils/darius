[workspace]
resolver = "2"
members = [
    "crates/darius-core",
    "crates/darius-rlm",
    "crates/darius-hashline",
    "crates/darius-lsp",
    "crates/darius-daemon",
    "crates/darius-cli",
    "crates/darius-skills",
    "crates/darius-safety",
    "crates/darius-skill-parser",
    "crates/darius-bench",
    "crates/darius-memory",
    "crates/darius-tools",
    "crates/darius-cognitive",
    "crates/darius-tui",
    "crates/darius-web",
    "tests/harness_e2e",
]
exclude = ["target"]

[workspace.package]
version = "1.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/galaxycoils/darius"
description = "Darius — the most powerful open-source agent harness"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
blake3 = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
bytes = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
tracing-test = "0.2"
